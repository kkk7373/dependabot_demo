version: 2
updates:
  - package-ecosystem: github-actions # GitHub Actionsのエコシステム。JSならnpmなど
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: actions/upload-artifact # 除外する依存関係の名前
        versions: # 除外する依存関係のバージョン
          - 4.3.0
          - 4.3.1
      - dependency-name: "actions/*"
        updates-types: # 除外するバージョンアップの種類
          - version-update:semver-major # 他は、semver-minor semver-patchがある。

